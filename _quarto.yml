project:
  type: website
  # Generate the name resolver's data (latest PPG release, sharded by genus)
  # on every build, including the daily scheduled one.
  pre-render: Rscript scripts/build-resolver-data.R
  resources:
    - resolver-data/
    - resolve.js
    - resolver-lib.js
    - resolve.R

website:
  title: "Pteridophyte Phylogeny Group"
  navbar:
