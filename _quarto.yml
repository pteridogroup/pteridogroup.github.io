      - href: guidelines.qmd
        text: Project Guidelines
      - href: github.qmd
        text: GitHub Guide
      - href: curators.qmd
        text: Curator's Guide
      - href: wfo.qmd
        text: World Flora Online
      - text: Classification
        menu:
